name: Scrape rents & deploy dashboard

on:
  schedule:
    # Twice a day: 13:05 UTC = 9:05am EDT (8:05am EST) and 23:05 UTC = 7:05pm EDT
    # (6:05pm EST). GitHub cron is UTC and ignores DST; a few minutes past the hour
    # because :00 crons get delayed the most. Each run re-snapshots the day (the row
    # for the date is replaced; the raw feed is kept per run) and emails the report.
    - cron: "5 13,23 * * *"
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab
  push:
    branches: [main]           # code pushes redeploy the dashboard from the committed data (no re-scrape)

permissions:
  contents: write              # commit the day's CSVs back to the repo
  pages: write                 # deploy to GitHub Pages
  id-token: write

# One run at a time, and a newer run always supersedes an older one.
# cancel-in-progress MUST stay true (lesson from the Sandlot dashboard): every run is
# idempotent (re-scraping a day replaces that day's rows; the site is rebuilt from
# scratch), so losing an in-flight run costs nothing, whereas a run stuck in `waiting`
# would otherwise hold the group forever and silently freeze the site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so `git pull --rebase` below always works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (parsers, CSV merge, dashboard derivations)
        run: python -m pytest -q

      - name: Scrape today's feed
        if: github.event_name != 'push'
        run: python scrape.py

      - name: Commit the data
        if: github.event_name != 'push'
        run: |
          git config user.name "rent-watch-bot"
          git config user.email "rent-watch-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: $(TZ=America/New_York date +%Y-%m-%d)"
            # If another run pushed the same date meanwhile, this run's (newer) rows win.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Build the dashboard
        run: python build_site.py

      - name: Email the report (skipped until the MAIL_* secrets exist — see README)
        if: github.event_name != 'push'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMS_TO: ${{ secrets.SMS_TO }}
          REPORT_BEDS: ${{ vars.REPORT_BEDS }}
        run: python email_report.py

      - name: Configure Pages
        # Pages must already be enabled with Source = GitHub Actions (see README); the
        # workflow token cannot create the site itself.
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
